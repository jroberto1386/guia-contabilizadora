<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-M">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía Contable Interactiva (IA)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chosen Palette: Warm Neutrals -->
    <!-- Application Structure Plan: Una interfaz 'Master-Detail'. Una barra lateral persistente (master) permite la navegación por categoría principal (Activo, Pasivo) y una lista con buscador de todas las cuentas. Hacer clic en una cuenta actualiza el área de contenido principal (detalle) para mostrar su información específica. Esta estructura se eligió por usabilidad, permitiendo a los usuarios encontrar rápidamente cualquier cuenta y ver sus detalles sin tener que desplazarse, a diferencia del reporte lineal. -->
    <!-- Visualization & Content Choices: Info del Reporte: Reglas 'Se Carga / Se Abona' para cada cuenta. Objetivo: Explicar visualmente la regla de débito/crédito para la cuenta seleccionada. Viz/Presentación: Una 'Cuenta T' (Esquema de Mayor) dinámica construida con HTML/Tailwind. Interacción: La Cuenta T se actualiza según la cuenta seleccionada, mostrando (Aumenta/Disminuye) en el lado correcto (Cargo/Abono) según la 'Naturaleza' de la cuenta (Deudora/Acreedora). Justificación: Esta es la herramienta pedagógica estándar para enseñar contabilidad, haciendo concretas y visuales las reglas abstractas del reporte. Librería: Ninguna (solo HTML/Tailwind). -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        .nav-button.active {
            background-color: #059669; /* emerald-600 */
            color: white;
        }
        .account-button:hover, .account-button.active {
            background-color: #F0FDF4; /* green-50 */
            border-right: 4px solid #059669; /* emerald-600 */
        }
        .t-account-container {
            border: 2px solid #D1D5DB; /* gray-300 */
            border-radius: 8px;
            overflow: hidden;
        }
        .t-account-header {
            border-bottom: 2px solid #D1D5DB; /* gray-300 */
        }
        .t-account-body {
            display: flex;
            min-height: 200px;
        }
        .t-account-side {
            width: 50%;
            padding: 1rem;
        }
        .t-account-left {
            border-right: 1px solid #D1D5DB; /* gray-300 */
        }
        .t-account-right {
            border-left: 1px solid #D1D5DB; /* gray-300 */
        }
        .t-account-side h4 {
            font-weight: 600;
            color: #4B5563; /* gray-600 */
            border-bottom: 1px dashed #9CA3AF; /* gray-400 */
            padding-bottom: 0.5rem;
        }
        .t-account-side .effect-increase {
            color: #059669; /* emerald-600 */
            font-weight: 500;
        }
        .t-account-side .effect-decrease {
            color: #DC2626; /* red-600 */
            font-weight: 500;
        }
        
        /* Ocultar scrollbar en la lista de cuentas para un look más limpio */
        #account-list-container::-webkit-scrollbar {
            display: none;
        }
        #account-list-container {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        /* Animación para la simulación */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease;
        }

        /* Estilos para el log de simulación dentro de la Cuenta T */
        .simulation-log {
            list-style: none;
            padding: 0;
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .simulation-log li {
            font-size: 0.875rem; /* text-sm */
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem; /* rounded */
        }
        .log-cargo {
            background-color: #D1FAE5; /* green-100 */
            color: #065F46; /* green-800 */
            border: 1px solid #6EE7B7; /* green-300 */
        }
        .log-abono {
            background-color: #FEE2E2; /* red-100 */
            color: #991B1B; /* red-800 */
            border: 1px solid #FCA5A5; /* red-300 */
        }
        
        /* Estilos para el botón de IA */
        .gemini-button {
            background-color: #EDE9FE; /* violet-100 */
            color: #5B21B6; /* violet-700 */
            border: 1px solid #C4B5FD; /* violet-300 */
        }
        .gemini-button:hover {
            background-color: #DDD6FE; /* violet-200 */
        }

        /* Salida de IA */
        #gemini-explain-output {
            background-color: #F5F3FF; /* violet-50 */
            border-left: 4px solid #7C3AED; /* violet-500 */
            padding: 1rem;
            margin-top: 1rem;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Overlay de Carga -->
    <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-[100] flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded-lg shadow-xl flex items-center gap-4">
            <svg class="animate-spin h-6 w-6 text-emerald-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span id="loading-message" class="text-lg font-medium text-gray-700">Procesando...</span>
        </div>
    </div>

    <!-- Encabezado Móvil -->
    <header class="md:hidden bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-40">
        <h1 class="text-xl font-bold text-gray-900">Guía Contable</h1>
        <button id="mobile-menu-button" class="p-2 rounded-lg text-gray-600 hover:bg-gray-100">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
        </button>
    </header>

    <div class="flex flex-col md:flex-row min-h-screen">
        
        <!-- Sidebar de Navegación -->
        <aside id="sidebar" class="w-full md:w-80 lg:w-96 bg-white border-r border-gray-200 flex-col shadow-lg 
                    fixed md:static inset-0 z-50 
                    transform -translate-x-full md:transform-none 
                    transition-transform duration-300 ease-in-out
                    flex">
            <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Guía Contable</h1>
                    <p class="text-sm text-gray-600">Explorador de Cuentas (IA)</p>
                </div>
                <button id="close-menu-button" class="md:hidden p-2 rounded-lg text-gray-600 hover:bg-gray-100">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <nav class="p-4 space-y-2">
                <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Categorías</h3>
                <button id="nav-fundamentos" class="nav-button w-full text-left px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100 font-medium active flex items-center gap-2">
                    📖 Fundamentos
                </button>
                <button id="nav-activo" class="nav-button w-full text-left px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100 font-medium flex items-center gap-2">
                    💼 1. Activo
                </button>
                <button id="nav-pasivo" class="nav-button w-full text-left px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100 font-medium flex items-center gap-2">
                    💳 2. Pasivo
                </button>
                <button id="nav-capital" class="nav-button w-full text-left px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100 font-medium flex items-center gap-2">
                    🏠 3. Capital Contable
                </button>
                <button id="nav-resultados" class="nav-button w-full text-left px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100 font-medium flex items-center gap-2">
                    📊 4. Cuentas de Resultados
                </button>
            </nav>
            
            <div class="p-4 border-t border-gray-200">
                <input type="search" id="search-bar" placeholder="Buscar cuenta..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <div class="flex-1 overflow-y-auto border-t border-gray-200" id="account-list-container">
                <p class="p-4 text-sm text-gray-500" id="account-list-placeholder">Selecciona una categoría para ver las cuentas.</p>
                <div id="account-list" class="divide-y divide-gray-100">
                    <!-- Las cuentas se cargarán aquí dinámicamente -->
                </div>
            </div>
        </aside>

        <!-- Área de Contenido Principal -->
        <main class="flex-1 p-6 md:p-10 bg-gray-50">
            <div class="max-w-4xl mx-auto" id="detail-view">
                <!-- El contenido se cargará aquí dinámicamente -->
            </div>
        </main>
    </div>

                { "id": "clientes", "categoria": "1. Activo", "subcategoria": "1.1 Activo Circulante", "nombre": "Clientes", "naturaleza": "Deudora", "se_carga": "Por las ventas de mercancía o servicios a crédito.", "se_abona": "Cuando el cliente paga (en efectivo, cheque o transferencia), o por devoluciones, descuentos sobre venta, o al declararse incobrable.", "saldo": "Representa el monto total que los clientes deben a la empresa por ventas a crédito." },

        /**
         * Llama a la API de Gemini con una lógica de reintentos (exponential backoff).
         * @param {string} prompt - El prompt para el modelo.
         * @param {string} systemPrompt - La instrucción del sistema para el modelo.
         * @param {number} maxRetries - Número máximo de reintentos.
         * @returns {Promise<string>} - El texto de la respuesta del modelo.
         */
        async function callGeminiWithBackoff(prompt, systemPrompt, maxRetries = 3) {
            let delay = 1000;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    return await callGemini(prompt, systemPrompt);
                } catch (error) {
                    if (i === maxRetries - 1) {
                        console.error("Error final de API:", error);
                        throw error;
                    }
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                }
            }
        }

        async function callGemini(prompt, systemPrompt) {
            const key = userApiKey; // Usar la clave incorporada
            
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${key}`;
            
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
            };

            if (systemPrompt) {
                payload.systemInstruction = {
                    parts: [{ text: systemPrompt }]
                };
            }

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                // Si el error es 400, probablemente la clave es inválida
                if (response.status === 400) {
                    // Ya no borramos la clave, solo informamos.
                    throw new Error("API Key inválida o malformada. Revisa la clave en el código.");
                }
                throw new Error(`Error en API: ${response.statusText}`);
            }

            const result = await response.json();
            const candidate = result.candidates?.[0];

            if (candidate && candidate.content?.parts?.[0]?.text) {
                return candidate.content.parts[0].text;
            } else {
                throw new Error("Respuesta de API inválida o vacía.");
            }
        }

        function simularOperacion(tipo, amount, description) {
            const account = allData.cuentas.find(c => c.id === currentAccount);
            if (!account) return;

            const balanceEl = document.getElementById('account-balance');
            const cargoLog = document.getElementById('cargo-log');
            const abonoLog = document.getElementById('abono-log');

            const li = document.createElement('li');
            li.classList.add('animate-fade-in');
            
            const formattedAmount = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(amount);

            if (tipo === 'CARGO') {
                if (account.naturaleza === 'Deudora') {
                    currentBalance += amount;
                } else {
                    currentBalance -= amount;
                }
                li.textContent = `+ ${description} (${formattedAmount})`;
                li.classList.add('log-cargo');
                cargoLog.appendChild(li);
            } 
            
            if (tipo === 'ABONO') {
                if (account.naturaleza === 'Acreedora') {
                    currentBalance += amount;
                } else {
                    currentBalance -= amount;
                }
                li.textContent = `- ${description} (${formattedAmount})`;
                li.classList.add('log-abono');
                abonoLog.appendChild(li);
            }

            balanceEl.textContent = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(currentBalance);
            
            balanceEl.classList.add('scale-110', 'text-emerald-500', 'transition-all', 'duration-150');

        async function handleExplainClick() {
            const textToExplain = document.getElementById('static-saldo-text').textContent;
            const outputDiv = document.getElementById('gemini-explain-output');
            
            showLoading("Explicando...");
            outputDiv.innerHTML = '';
            outputDiv.classList.add('hidden');

            try {
                const systemPrompt = "Eres un profesor de contabilidad amable y paciente. Explica conceptos de forma muy sencilla, como para un principiante absoluto, en no más de 3 frases.";
                const userQuery = `Explica este concepto: "${textToExplain}"`;
                
                const explanation = await callGeminiWithBackoff(userQuery, systemPrompt);
                
                outputDiv.innerHTML = `<p class="text-gray-700">${explanation}</p>`;
                outputDiv.classList.remove('hidden');
            } catch (error) {
                let errorMessage = "Error al contactar la IA. Intenta de nuevo.";
                if (error.message.includes("API Key")) {
                    errorMessage = error.message; // Mostrar el error específico de la API Key
                }
                outputDiv.innerHTML = `<p class="text-red-600">${errorMessage}</p>`;
                outputDiv.classList.remove('hidden');
            } finally {
                hideLoading();
            }
        }

        async function handleScenarioClick() {
            const account = allData.cuentas.find(c => c.id === currentAccount);
            if (!account) return;

            const outputDiv = document.getElementById('gemini-scenario-output');
            showLoading("Generando escenario...");
            outputDiv.innerHTML = '';

            try {
                const systemPrompt = "Eres un asistente de contabilidad. Genera un ejemplo de transacción del mundo real para una cuenta. Responde *solo* en este formato, sin explicaciones: TIPO: [CARGO/ABONO]\nMONTO: [un número aleatorio entre 1000 y 15000]\nDESCRIPCION: [una descripción breve, ej. 'Cobro a cliente Juan Pérez']";
                const userQuery = `Genera un ejemplo para la cuenta: "${account.nombre}"`;

                const scenarioText = await callGeminiWithBackoff(userQuery, systemPrompt);
                
                // Parsear la respuesta
                const tipoMatch = scenarioText.match(/TIPO:\s*(CARGO|ABONO)/i);
                const montoMatch = scenarioText.match(/MONTO:\s*(\d+)/);
                const descMatch = scenarioText.match(/DESCRIPCION:\s*(.*)/);

                if (!tipoMatch || !montoMatch || !descMatch) {
                    throw new Error("Respuesta de IA en formato inesperado.");
                }

                const tipo = tipoMatch[1].toUpperCase();
                const monto = parseFloat(montoMatch[1]);
                const descripcion = descMatch[1].trim();

                outputDiv.innerHTML = `
                    <div class="bg-white p-4 rounded-lg border border-gray-200">
                        <p class="text-sm text-gray-600">Escenario Sugerido:</p>
                        <p class="text-lg font-semibold text-gray-800">${descripcion}</p>
                        <p class="text-md text-gray-700">Monto: <strong class="text-emerald-700">${new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(monto)}</strong></p>
                        <p class="text-md text-gray-700">Tipo: <strong class="${tipo === 'CARGO' ? 'text-green-700' : 'text-red-700'}">${tipo}</strong></p>
                        <button id="gemini-apply-btn"
                                data-tipo="${tipo}"
                                data-monto="${monto}"
                                data-descripcion="${descripcion}"
                                class="w-full mt-3 bg-emerald-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-emerald-700 transition-colors">
                            Aplicar Simulación
                        </button>
                    </div>
                `;

            } catch (error) {
                let errorMessage = "Error al generar escenario. Intenta de nuevo.";
                if (error.message.includes("API Key")) {
                    errorMessage = error.message; // Mostrar el error específico de la API Key
                }
                outputDiv.innerHTML = `<p class="text-red-600">${errorMessage}</p>`;
            } finally {
                hideLoading();
            }
        }

        function handleApplyClick(target) {
            const tipo = target.dataset.tipo;
            const monto = parseFloat(target.dataset.monto);
            const descripcion = target.dataset.descripcion;

            simularOperacion(tipo, monto, descripcion);
            
            // Limpiar el escenario
            document.getElementById('gemini-scenario-output').innerHTML = '';

            const target = e.target.closest('button');

            if (target.id === 'gemini-scenario-btn') {

            if (target.id === 'gemini-apply-btn') {

            }
        });

        renderFundamentos();
        updateActiveNavButton();
